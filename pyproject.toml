[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "threatpulse"
version = "1.0.0"
description = "Real-time cyber threat detection & intelligence engine: streaming flows, layered detectors, online ML, kill-chain correlation."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "coolstack-coder" }]
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "numpy>=1.26",
  "prometheus-client>=0.20",
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
capture = ["scapy>=2.5"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
threatpulse = "threatpulse.cli:main"

[tool.setuptools.packages.find]
include = ["threatpulse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
